<!-- Course Details Modal -->
<app-modal
    visible="showCourseDetailsModal"
    title="Enter Course Details"
    size="md"
    on-close="closeCourseDetailsModal()"
>
    <modal-body>
        <div class="course-details-modal-content">
            <div class="form-row">
                <div class="form-group">
                    <app-input
                        label="Course Name"
                        type="text"
                        ng-model="courseForm.name"
                        placeholder="Enter course name"
                    ></app-input>
                </div>
                <div class="form-group">
                    <app-input
                        label="Course Duration"
                        type="text"
                        ng-model="courseForm.duration"
                        placeholder="e.g., 3 Yr"
                    ></app-input>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <app-input
                        label="Seats Available"
                        type="number"
                        ng-model="courseForm.seats"
                        placeholder="Enter number of seats"
                    ></app-input>
                </div>
                <div class="form-group">
                    <app-textarea
                        label="Description"
                        ng-model="courseForm.fullName"
                        placeholder="Enter course description"
                        rows="3"
                    ></app-textarea>
                </div>
            </div>
        </div>
    </modal-body>
    <modal-footer>
        <button class="btn-submit" ng-click="saveCourseDetails()">Submit</button>
    </modal-footer>
</app-modal>
