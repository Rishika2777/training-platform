<!-- Campus Sidebar Profile -->
<div class="sidebar-profile">
    <div class="campus-image-wrapper">
        <img ng-src="{{ campusImage }}" alt="Campus" class="campus-image" />
    </div>
    <h3 class="campus-name">{{ campusName || 'Campus Name' }}</h3>
    <p class="campus-rank">{{ campusRank || 'Rank' }}</p>
</div>
