<div class="registration-page">
    <!-- Use existing header component -->
    <div
        class="layout-header"
        ng-include="'app/layout/header/header.html'"
        ng-controller="headerController"
    ></div>

    <div class="registration-content">
        <app-company-form
            ng-model="companyData"
            mode="create"
            on-submit="handleSubmit(company)"
            on-cancel="handleCancel()"
        ></app-company-form>
    </div>
</div>
