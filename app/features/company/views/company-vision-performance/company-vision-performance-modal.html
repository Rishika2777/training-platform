<!-- Vision & Achievements Modal -->
<app-modal
    visible="showVisionModal"
    title="Our Vision & Achievements"
    size="lg"
    on-close="closeVisionModal()"
>
    <modal-body>
        <div class="vision-achievements-modal-content">
            <div class="form-group">
                <label class="form-label" for="company-vision">Company's Vision</label>
                <textarea
                    id="company-vision"
                    name="company-vision"
                    class="vision-textarea"
                    rows="6"
                    ng-model="modalVisionData.vision"
                    placeholder="Enter company vision..."
                ></textarea>
            </div>

            <div class="metrics-section">
                <div class="metrics-row">
                    <div class="metric-column">
                        <label class="form-label" for="metric-name">Metric Name</label>
                        <select
                            id="metric-name"
                            name="metric-name"
                            class="metric-input"
                            ng-model="modalVisionData.metricName"
                        >
                            <option value="">Select Metric</option>
                            <option value="Customer Satisfaction Rate">
                                Customer Satisfaction Rate
                            </option>
                            <option value="Employee Retention Rate">Employee Retention Rate</option>
                            <option value="Revenue Growth">Revenue Growth</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="metric-column">
                        <label class="form-label" for="metric-value">Value</label>
                        <select
                            id="metric-value"
                            name="metric-value"
                            class="metric-input"
                            ng-model="modalVisionData.value"
                        >
                            <option value="">Select Value</option>
                            <option value="99%">99%</option>
                            <option value="95%">95%</option>
                            <option value="90%">90%</option>
                        </select>
                    </div>
                    <div class="metric-column">
                        <label class="form-label" for="metric-year">Year</label>
                        <select
                            id="metric-year"
                            name="metric-year"
                            class="metric-input"
                            ng-model="modalVisionData.year"
                        >
                            <option value="">Select Year</option>
                            <option value="2023">2023</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </modal-body>
    <modal-footer>
        <button class="btn-submit" ng-click="submitVisionAchievements()">Submit</button>
    </modal-footer>
</app-modal>
