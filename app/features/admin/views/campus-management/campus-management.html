<div class="admin-page">
    <!-- Announcement Banner -->
    <div class="announcement-wrapper">
        <app-announcement-card date="January 7th, 2025" title="Synkup Announcement">
        </app-announcement-card>
    </div>

    <div class="admin-page-header">
        <h1 class="admin-page-title">Registered Campus</h1>
        <app-fab-button icon="plus" size="md" onClick="openAddCampusModal()" title="Add New Campus">
        </app-fab-button>
    </div>

    <div class="admin-cards-grid" ng-if="!loading && campuses.length > 0">
        <app-card
            ng-repeat="campus in campuses"
            image-src="{{campus.image || 'assets/images/campus-placeholder.jpg'}}"
            image-shape="rectangle"
            title="{{campus.name || 'Campus Name'}}"
        >
            <div card-actions>
                <app-card-action
                    label="View"
                    variant="view"
                    onClick="viewCampus(campus)"
                ></app-card-action>
                <app-card-action
                    label="Delete"
                    variant="delete"
                    onClick="deleteCampus(campus)"
                ></app-card-action>
            </div>
        </app-card>
    </div>

    <div class="admin-empty-state" ng-if="!loading && campuses.length === 0">
        <p>No campuses registered yet.</p>
    </div>

    <div class="admin-loading" ng-if="loading">
        <p>Loading campuses...</p>
    </div>

    <app-pagination
        ng-if="totalPages > 1"
        current-page="currentPage"
        total-pages="totalPages"
        on-page-change="onPageChange(page)"
    ></app-pagination>
</div>
