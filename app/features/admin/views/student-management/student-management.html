<div class="admin-page">
    <!-- Announcement Banner -->
    <div class="announcement-wrapper">
        <app-announcement-card date="January 7th, 2025" title="Synkup Announcement">
        </app-announcement-card>
    </div>

    <div class="admin-page-header">
        <h1 class="admin-page-title">Registered Students</h1>
        <app-fab-button
            icon="plus"
            size="md"
            onClick="openAddStudentModal()"
            title="Add New Student"
        >
        </app-fab-button>
    </div>

    <div class="admin-cards-grid" ng-if="!loading && students.length > 0">
        <app-card
            ng-repeat="student in students"
            image-src="{{student.image || 'assets/images/student-placeholder.jpg'}}"
            image-shape="circle"
            title="{{student.name || 'Student Name'}}"
            subtitle="{{student.campusName || 'Campus Name'}}"
        >
            <div card-actions>
                <app-card-action
                    label="View"
                    variant="view"
                    onClick="viewStudent(student)"
                ></app-card-action>
                <app-card-action
                    label="Delete"
                    variant="delete"
                    onClick="deleteStudent(student)"
                ></app-card-action>
            </div>
        </app-card>
    </div>

    <div class="admin-empty-state" ng-if="!loading && students.length === 0">
        <p>No students registered yet.</p>
    </div>

    <div class="admin-loading" ng-if="loading">
        <p>Loading students...</p>
    </div>

    <app-pagination
        ng-if="totalPages > 1"
        current-page="currentPage"
        total-pages="totalPages"
        on-page-change="onPageChange(page)"
    ></app-pagination>
</div>
