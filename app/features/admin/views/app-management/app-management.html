<div class="admin-page admin-page--app-management">
    <div class="admin-page-header admin-page-header--app-management">
        <h1 class="admin-page-title">App Management</h1>
    </div>

    <div class="admin-dashboard-stats admin-dashboard-stats--app-management" ng-if="!loading">
        <!-- Users Engagement (Line) -->
        <div class="admin-chart-card admin-chart-card--engagement">
            <div class="admin-chart-header">
                <h3>Users Engagement</h3>
                <select
                    class="chart-year-select"
                    ng-model="filters.year"
                    ng-change="onYearChange()"
                >
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>
            <div class="chart-surface">
                <svg
                    class="chart-svg chart-svg--line"
                    ng-attr-viewBox="{{ lineChart.viewBox }}"
                    preserveAspectRatio="none"
                    aria-label="Users engagement line chart"
                >
                    <g class="chart-grid">
                        <line
                            ng-repeat="gl in lineChart.gridLines"
                            ng-attr-x1="{{ gl.x1 }}"
                            ng-attr-y1="{{ gl.y1 }}"
                            ng-attr-x2="{{ gl.x2 }}"
                            ng-attr-y2="{{ gl.y2 }}"
                            class="chart-grid-line"
                        ></line>
                    </g>

                    <polyline
                        class="chart-line"
                        ng-attr-points="{{ lineChart.polylinePoints }}"
                    ></polyline>

                    <circle
                        ng-repeat="p in lineChart.points"
                        class="chart-dot"
                        ng-attr-cx="{{ p.x }}"
                        ng-attr-cy="{{ p.y }}"
                        ng-attr-r="{{ p.r }}"
                    ></circle>

                    <g class="chart-xlabels">
                        <text
                            ng-repeat="lbl in lineChart.xLabels"
                            class="chart-xlabel"
                            ng-attr-x="{{ lbl.x }}"
                            ng-attr-y="{{ lbl.y }}"
                            text-anchor="middle"
                        >
                            {{ lbl.text }}
                        </text>
                    </g>
                </svg>
                <div class="chart-legend">
                    <span class="chart-legend-dot chart-legend-dot--line"></span>
                    <span class="chart-legend-text">Users Engagement</span>
                </div>
            </div>
        </div>

        <!-- Successful Placements (Bar) -->
        <div class="admin-chart-card admin-chart-card--placements">
            <div class="admin-chart-header">
                <h3>Successful Placements</h3>
                <select
                    class="chart-year-select"
                    ng-model="filters.year"
                    ng-change="onYearChange()"
                >
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>
            <div class="chart-surface">
                <svg
                    class="chart-svg chart-svg--bar"
                    ng-attr-viewBox="{{ barChart.viewBox }}"
                    preserveAspectRatio="none"
                    aria-label="Successful placements bar chart"
                >
                    <g class="chart-grid">
                        <line
                            ng-repeat="gl in barChart.gridLines"
                            ng-attr-x1="{{ gl.x1 }}"
                            ng-attr-y1="{{ gl.y1 }}"
                            ng-attr-x2="{{ gl.x2 }}"
                            ng-attr-y2="{{ gl.y2 }}"
                            class="chart-grid-line"
                        ></line>
                    </g>

                    <rect
                        ng-repeat="b in barChart.bars"
                        class="chart-bar"
                        ng-attr-x="{{ b.x }}"
                        ng-attr-y="{{ b.y }}"
                        ng-attr-width="{{ b.w }}"
                        ng-attr-height="{{ b.h }}"
                        ng-attr-rx="{{ b.rx }}"
                    ></rect>

                    <g class="chart-xlabels">
                        <text
                            ng-repeat="lbl in barChart.xLabels"
                            class="chart-xlabel"
                            ng-attr-x="{{ lbl.x }}"
                            ng-attr-y="{{ lbl.y }}"
                            text-anchor="middle"
                        >
                            {{ lbl.text }}
                        </text>
                    </g>
                </svg>
                <div class="chart-legend">
                    <span class="chart-legend-dot chart-legend-dot--bar"></span>
                    <span class="chart-legend-text">Successful Placements</span>
                </div>
            </div>
        </div>

        <!-- Registered Entities (Pie) -->
        <div class="admin-chart-card admin-chart-card--entities">
            <div class="admin-chart-header">
                <h3>Registered Entities</h3>
                <select
                    class="chart-year-select"
                    ng-model="filters.year"
                    ng-change="onYearChange()"
                >
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>

            <div class="entities-layout">
                <svg
                    class="chart-svg chart-svg--pie"
                    ng-attr-viewBox="{{ pieChart.viewBox }}"
                    preserveAspectRatio="xMidYMid meet"
                    aria-label="Registered entities pie chart"
                >
                    <g>
                        <path
                            ng-repeat="s in pieChart.segments"
                            ng-attr-d="{{ s.d }}"
                            ng-attr-fill="{{ s.color }}"
                        ></path>
                    </g>
                    <g>
                        <text
                            ng-repeat="t in pieChart.labels"
                            class="chart-pie-label"
                            ng-attr-x="{{ t.x }}"
                            ng-attr-y="{{ t.y }}"
                            text-anchor="middle"
                        >
                            {{ t.text }}
                        </text>
                    </g>
                </svg>

                <div class="entities-legend">
                    <div class="entities-legend-item" ng-repeat="it in pieChart.legend">
                        <span
                            class="entities-legend-swatch"
                            ng-style="{ background: it.color }"
                        ></span>
                        <span class="entities-legend-text">{{ it.label }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-loading" ng-if="loading">
        <p>Loading analytics...</p>
    </div>
</div>
