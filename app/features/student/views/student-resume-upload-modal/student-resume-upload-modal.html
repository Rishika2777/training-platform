<!-- Resume Upload Modal -->
<app-modal
    visible="showResumeUploadModal"
    title="resume-upload"
    size="md"
    on-close="closeResumeUploadModal()"
>
    <modal-body>
        <div class="resume-upload-modal-content">
            <h3 class="modal-headline">Showcase your expertise</h3>
            <p class="modal-subheadline">Upload your resume now!</p>

            <div class="ai-resume-section">
                <p>Need a professional resume? Use AI to generate yours in just a few clicks!</p>
                <button class="btn-download" ng-click="generateResume()">Download Now</button>
            </div>

            <p class="upload-instruction">
                Upload your document and open the door to new opportunities!
            </p>

            <div class="upload-area">
                <app-input
                    type="file"
                    ng-model="resumeFile"
                    accept=".pdf,.doc,.docx"
                    placeholder="drop the document here"
                    on-file-select="onResumeFileSelected(files)"
                    icon="fa-plus"
                ></app-input>
            </div>
        </div>
    </modal-body>
    <modal-footer>
        <button class="btn-submit" ng-click="submitResume()">Submit</button>
    </modal-footer>
</app-modal>
