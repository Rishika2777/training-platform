<div class="app-post-footer" role="group" aria-label="Post actions">
    <button
        type="button"
        class="app-post-footer-btn"
        ng-class="{'app-post-footer-btn--active': liked}"
        ng-click="toggleLike()"
        aria-label="Like"
    >
        <i class="fa fa-thumbs-up"></i>
    </button>
    <button
        type="button"
        class="app-post-footer-btn"
        ng-class="{'app-post-footer-btn--active': flagged}"
        ng-click="toggleFlag()"
        aria-label="Flag"
    >
        <i class="fa fa-exclamation-circle"></i>
    </button>
</div>
