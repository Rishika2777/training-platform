<div class="app-form-container">
    <h2 class="app-form-title">{{formTitle}}</h2>

    <form ng-submit="handleSubmit()" name="campusForm" novalidate>
        <div class="app-form-row">
            <app-input
                label="Campus Name"
                type="text"
                ng-model="campusData.name"
                required="true"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Upload Photo"
                type="file"
                ng-model="campusData.photo"
                accept="image/*"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Campus Rank"
                type="text"
                ng-model="campusData.rank"
                disabled="isReviewMode"
            ></app-input>
        </div>

        <div class="app-form-row">
            <app-input
                label="Admin Name"
                type="text"
                ng-model="campusData.adminName"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Admin Email"
                type="email"
                ng-model="campusData.adminEmail"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Admin Phone No."
                type="tel"
                ng-model="campusData.adminPhone"
                disabled="isReviewMode"
            ></app-input>
        </div>

        <div class="app-form-row">
            <app-input
                label="Admin Dept"
                type="text"
                ng-model="campusData.adminDept"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Admin Designation"
                type="text"
                ng-model="campusData.adminDesignation"
                disabled="isReviewMode"
            ></app-input>

            <app-input
                label="Campus Website URL"
                type="url"
                ng-model="campusData.website"
                placeholder="https://example.com"
                disabled="isReviewMode"
            ></app-input>
        </div>

        <div class="app-form-row app-form-row-textarea">
            <div class="app-form-col-textarea">
                <app-textarea
                    label="About Campus"
                    ng-model="campusData.about"
                    rows="4"
                    disabled="isReviewMode"
                ></app-textarea>
            </div>

            <div class="app-form-col-textarea">
                <app-textarea
                    label="Campus Address"
                    ng-model="campusData.address"
                    rows="4"
                    disabled="isReviewMode"
                ></app-textarea>
            </div>
        </div>

        <div class="app-form-actions" ng-if="!isReviewMode">
            <app-button
                type="button"
                variant="secondary"
                label="Cancel"
                onClick="handleCancel()"
                ng-if="onCancel"
            ></app-button>
            <app-button type="submit" variant="submit" label="Submit"></app-button>
        </div>

        <div class="app-form-actions" ng-if="isReviewMode">
            <app-button
                type="button"
                variant="delete"
                label="Reject"
                onClick="handleCancel()"
                ng-if="onCancel"
            ></app-button>
            <app-button
                type="button"
                variant="view"
                label="Approve"
                onClick="handleSubmit()"
            ></app-button>
        </div>
    </form>
</div>
