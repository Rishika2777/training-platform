<div class="app-form-container">
    <h2 class="app-form-title">{{formTitle}}</h2>

    <app-step-indicator
        steps="steps"
        current-step="currentStep"
        disabled="isReviewMode"
    ></app-step-indicator>

    <form ng-submit="handleSubmit()" name="studentForm" novalidate>
        <!-- Step 1: Personal Information -->
        <div ng-if="currentStep === 0" class="app-form-step">
            <div class="app-form-row">
                <app-input
                    label="First Name"
                    type="text"
                    ng-model="studentData.firstName"
                    required="true"
                    disabled="isReviewMode"
                ></app-input>

                <app-input
                    label="Last Name"
                    type="text"
                    ng-model="studentData.lastName"
                    disabled="isReviewMode"
                ></app-input>

                <app-input
                    label="Upload Photo"
                    type="file"
                    ng-model="studentData.photo"
                    accept="image/*"
                    disabled="isReviewMode"
                ></app-input>
            </div>

            <div class="app-form-row">
                <app-input
                    label="Date of Birth"
                    type="date"
                    ng-model="studentData.dateOfBirth"
                    required="true"
                    disabled="isReviewMode"
                ></app-input>

                <app-dropdown
                    label="Gender"
                    ng-model="studentData.gender"
                    options="genderOptions"
                    option-value="value"
                    option-label="label"
                    required="true"
                    disabled="isReviewMode"
                ></app-dropdown>

                <app-input
                    label="Mobile No."
                    type="tel"
                    ng-model="studentData.mobile"
                    required="true"
                    disabled="isReviewMode"
                ></app-input>
            </div>

            <div class="app-form-row app-form-row-email-address">
                <app-input
                    label="Email"
                    type="email"
                    ng-model="studentData.email"
                    required="true"
                    disabled="isReviewMode"
                ></app-input>

                <div class="app-form-col-textarea">
                    <app-textarea
                        label="Address"
                        ng-model="studentData.address"
                        rows="3"
                        disabled="isReviewMode"
                    ></app-textarea>
                </div>
            </div>

            <div class="app-form-row">
                <div class="app-form-col-full">
                    <app-textarea
                        label="Profile Summary"
                        ng-model="studentData.profileSummary"
                        rows="4"
                        disabled="isReviewMode"
                    ></app-textarea>
                </div>
            </div>
        </div>

        <!-- Step 2: Education Details -->
        <div ng-if="currentStep === 1" class="app-form-step">
            <div class="app-form-row">
                <app-input
                    label="Degree"
                    type="text"
                    ng-model="studentData.education.degree"
                    disabled="isReviewMode"
                ></app-input>

                <app-input
                    label="Institution"
                    type="text"
                    ng-model="studentData.education.institution"
                    disabled="isReviewMode"
                ></app-input>

                <app-input
                    label="Year"
                    type="text"
                    ng-model="studentData.education.year"
                    placeholder="YYYY"
                    disabled="isReviewMode"
                ></app-input>
            </div>

            <div class="app-form-row">
                <app-input
                    label="GPA"
                    type="text"
                    ng-model="studentData.education.gpa"
                    placeholder="0.00"
                    disabled="isReviewMode"
                ></app-input>
            </div>
        </div>

        <!-- Step 3: Skills and Experience -->
        <div ng-if="currentStep === 2" class="app-form-step">
            <div class="app-form-section">
                <h3 class="app-form-section-title">Skills</h3>
                <div class="app-form-row">
                    <app-input
                        label="Add Skill"
                        type="text"
                        ng-model="newSkill"
                        placeholder="Enter skill name"
                        disabled="isReviewMode"
                    ></app-input>
                    <div class="app-form-action-col" ng-if="!isReviewMode">
                        <app-button
                            type="button"
                            variant="primary"
                            label="Add"
                            onClick="addSkill()"
                        ></app-button>
                    </div>
                </div>
                <div class="app-form-tags" ng-if="studentData.skills.length > 0">
                    <span
                        class="app-form-tag"
                        ng-repeat="skill in studentData.skills track by $index"
                    >
                        {{skill}}
                        <button
                            type="button"
                            class="app-form-tag-remove"
                            ng-click="studentData.skills.splice($index, 1)"
                            ng-if="!isReviewMode"
                        >
                            ×
                        </button>
                    </span>
                </div>
            </div>
        </div>

        <!-- Step 4: Additional Information -->
        <div ng-if="currentStep === 3" class="app-form-step">
            <div class="app-form-row">
                <div class="app-form-col-full">
                    <app-textarea
                        label="Additional Notes"
                        ng-model="studentData.additionalNotes"
                        rows="6"
                        disabled="isReviewMode"
                    ></app-textarea>
                </div>
            </div>
        </div>

        <div class="app-form-actions">
            <app-button
                type="button"
                variant="secondary"
                label="Go Back"
                onClick="prevStep()"
                ng-if="!isFirstStep()"
            ></app-button>

            <app-button
                type="button"
                variant="secondary"
                label="Cancel"
                onClick="handleCancel()"
                ng-if="onCancel && !isReviewMode"
            ></app-button>

            <app-button
                type="button"
                variant="primary"
                label="Save and Next"
                onClick="nextStep()"
                ng-if="!isLastStep() && !isReviewMode"
            ></app-button>

            <app-button
                type="submit"
                variant="primary"
                label="Submit"
                ng-if="isLastStep() && !isReviewMode"
            ></app-button>

            <app-button
                type="button"
                variant="delete"
                label="Reject"
                onClick="handleCancel()"
                ng-if="isReviewMode && isLastStep() && onCancel"
            ></app-button>

            <app-button
                type="button"
                variant="view"
                label="Approve"
                onClick="handleSubmit()"
                ng-if="isReviewMode && isLastStep()"
            ></app-button>
        </div>
    </form>
</div>
