<div class="campus-form-container">

    <h2>Campus Registration Form</h2>

    <form ng-submit="submitCampus()">

        <div class="row">
            <div class="form-group">
                <label>Campus Name</label>
                <input type="text" ng-model="campus.name">
            </div>

            <div class="form-group">
                <label>Upload Photo</label>
                <input type="file">
            </div>

            <div class="form-group">
                <label>Campus Rank</label>
                <input type="text" ng-model="campus.rank">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" ng-model="campus.adminName">
            </div>

            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" ng-model="campus.adminEmail">
            </div>

            <div class="form-group">
                <label>Admin Phone No.</label>
                <input type="text" ng-model="campus.adminPhone">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Admin Dept</label>
                <input type="text" ng-model="campus.adminDept">
            </div>

            <div class="form-group">
                <label>Admin Designation</label>
                <input type="text" ng-model="campus.adminDesignation">
            </div>

            <div class="form-group">
                <label>Campus Website URL</label>
                <input type="text" ng-model="campus.website">
            </div>
        </div>

        <div class="row">
            <div class="form-group full">
                <label>About Campus</label>
                <textarea ng-model="campus.about"></textarea>
            </div>

            <div class="form-group full">
                <label>Campus Address</label>
                <textarea ng-model="campus.address"></textarea>
            </div>
        </div>

        <button class="submit-btn">Submit</button>

    </form>

</div>
