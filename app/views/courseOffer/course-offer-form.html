<div class="course-form-container" ng-controller="AddCourseCtrl">
    <div class="course-form-box">
        
        <div class="top-bar">
            <h2>Enter Course Details</h2>
            <span class="close-btn" ng-click="closeForm()">✕</span>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Course Name</label>
                <input type="text" ng-model="course.name" />
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" ng-model="course.category" />
            </div>

            <div class="form-group">
                <label>Upload Photo</label>
                <div class="upload-box">
                    <input type="file" id="fileUpload" ng-model="course.photo" />
                    <span class="upload-icon">📎</span>
                </div>
            </div>

            <div class="form-group">
                <label>Course Duration</label>
                <input type="text" ng-model="course.duration" />
            </div>

            <div class="form-group full-width">
                <label>Description</label>
                <textarea ng-model="course.description"></textarea>
            </div>

        </div>

        <div class="submit-wrap">
            <button class="submit-btn" ng-click="submitCourse()">Submit</button>
        </div>

    </div>
</div>
