<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="Synkup">
        <div class="brand-mark">Synkup</div>
      </div>

      @if (showSearch) {
        <app-search
          class="search"
          [placeholder]="searchPlaceholder"
          [value]="searchValue"
          (valueChange)="handleSearch($event)"
          (searched)="handleSearched($event)"
        />
      } @else {
        <div class="spacer"></div>
      }
    </div>
  </header>

  <main class="content">
    <section class="page">
      <ng-content />
    </section>
  </main>
</div>
