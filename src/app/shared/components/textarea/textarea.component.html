<div class="field">
  @if (label) {
    <label class="label" [attr.for]="controlId">
      {{ label }}
      @if (required) {
        <span class="asterisk" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    class="control"
    [class.invalid]="invalid"
    [id]="controlId"
    [disabled]="disabled"
    [rows]="rows"
    [attr.required]="required ? '' : null"
    [attr.aria-required]="required"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput(getValue($event))"
  ></textarea>
</div>
