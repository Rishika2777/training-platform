<div class="field">
  @if (label) {
    <label class="label" [attr.for]="type === 'file' ? null : controlId">
      {{ label }}
      @if (required) {
        <span class="asterisk" aria-hidden="true">*</span>
      }
    </label>
  }

  @if (type === 'file') {
    <div
      class="file-wrapper"
      [class.invalid]="invalid"
      [class.disabled]="disabled"
      [class.has-file]="selectedFileNames || existingFileName"
      tabindex="0"
      role="button"
      [attr.aria-disabled]="disabled"
      (click)="!disabled && fileInput.click()"
      (keydown.enter)="!disabled && fileInput.click()"
      (keydown.space)="$event.preventDefault(); !disabled && fileInput.click()"
    >
      <span class="file-placeholder" [class.has-file]="selectedFileNames || existingFileName">{{ getFileDisplayText() }}</span>
      <i class="fa-solid fa-paperclip file-icon" aria-hidden="true"></i>

      <input
        #fileInput
        class="file-native"
        [id]="controlId"
        [disabled]="disabled"
        type="file"
        [attr.required]="required ? '' : null"
        [attr.aria-required]="required"
        [attr.accept]="accept"
        (change)="onFileChange(getFiles($event))"
      />
    </div>
  } @else {
    <div class="input-wrapper" [class.has-password-toggle]="type === 'password'">
      <input
        #inputElement
        class="control"
        [class.invalid]="invalid"
        [id]="controlId"
        [disabled]="disabled"
        [readonly]="readonly"
        [type]="effectiveType"
        [attr.required]="required ? '' : null"
        [attr.aria-required]="required"
        [attr.maxlength]="maxlength"
        [attr.min]="min"
        [attr.max]="max"
        [placeholder]="placeholder"
        [ngModel]="value"
        (ngModelChange)="onInput($event)"
        (click)="onDateInputClick($event, inputElement)"
      />
      @if (type === 'password') {
        <button
          type="button"
          class="password-toggle"
          [disabled]="disabled"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
          tabindex="-1"
        >
          @if (passwordVisible) {
            <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
          } @else {
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          }
        </button>
      }
    </div>
  }
</div>
