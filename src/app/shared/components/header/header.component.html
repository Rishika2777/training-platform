<header class="top-header" [class.simple]="isSimpleHeader()">
  @if (!isSimpleHeader()) {
    <div class="header-left">
      <button
        class="hamburger"
        type="button"
        (click)="toggleSidebar.emit()"
        [attr.aria-expanded]="!sidebarCollapsed"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <div class="brand" [routerLink]="['/']">
        <div class="brand-mark">RecN</div>
      </div>
    </div>
  }

  <div class="header-center">
    <h1 class="page-title">{{ pageTitle() }}</h1>
  </div>

  @if (!isSimpleHeader()) {
    <div class="header-right">
      <div class="search">
        <input
          class="search-input"
          type="text"
          placeholder="Search for anything"
          [value]="searchValue()"
          (input)="onSearchInput($event)"
        />
        <button class="search-btn" type="button" (click)="submitSearch()">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
      </div>

      <button class="icon" type="button" title="Home" (click)="goHome()">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
      </button>
      <button class="icon" type="button" title="Notifications" (click)="noop()">
        <i class="fa-regular fa-bell" aria-hidden="true"></i>
      </button>
      <a class="icon" title="Settings" [routerLink]="['/settings']">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </a>
      <button class="icon" type="button" title="Refresh" (click)="refresh()">
        <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
      </button>

      @if (isAuthenticated()) {
        <button class="logout" type="button" (click)="logout()">Logout</button>
      }
    </div>
  }
</header>
