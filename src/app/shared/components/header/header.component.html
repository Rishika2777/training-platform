<header class="top-header" [class.simple]="isSimpleHeader()">
  @if (!isSimpleHeader()) {
    <div class="header-left">
      @if (!standalone) {
        <button
          class="hamburger"
          type="button"
          (click)="toggleSidebar.emit()"
          [attr.aria-expanded]="!sidebarCollapsed"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      }

      <div class="brand" [routerLink]="['/']">
        <div class="brand-mark">Synkup</div>
      </div>
    </div>
  }

  <div class="header-center">
    <h1 class="page-title">{{ pageTitle() }}</h1>
  </div>

  @if (!isSimpleHeader()) {
    <div class="header-right">
      <div class="search">
        <input
          class="search-input"
          type="text"
          placeholder="Search for anything"
          [value]="searchValue()"
          (input)="onSearchInput($event)"
        />
        <button class="search-btn" type="button" (click)="submitSearch()">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
      </div>

      <button class="icon" type="button" title="Home" (click)="goHome()">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
      </button>
      <div class="notifications-wrapper">
        <button class="icon" type="button" title="Notifications" (click)="toggleNotifications($event)">
          <i class="fa-regular fa-bell" aria-hidden="true"></i>
        </button>
        <app-notifications-dropdown
          [isOpen]="notificationsOpen()"
          [items]="notifications"
          (closed)="closeNotifications()"
          (seePrevious)="onSeePreviousNotifications()"
        />
      </div>
      <div class="settings-wrapper">
        <button class="icon" type="button" title="Settings" (click)="toggleSettings($event)">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </button>
        <app-settings-dropdown
          [isOpen]="settingsOpen()"
          (closed)="closeSettings()"
          (optionSelected)="handleSettingsOption($event)"
        />
      </div>

      @if (isAuthenticated()) {
        <button class="icon" type="button" title="Logout" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </button>
      }
    </div>
  }
</header>

<!-- Edit Profile Modal -->
@if (selectedOption() === 'edit-profile') {
  <app-modal
    [visible]="true"
    title="Edit Profile"
    size="lg"
    (closed)="closeOptionModal()"
  >
    <app-edit-profile-modal (closed)="closeOptionModal()" />
  </app-modal>
}

<!-- Change Password Modal -->
@if (selectedOption() === 'password') {
  <app-modal
    [visible]="true"
    title="Change Password"
    size="sm"
    (closed)="closeOptionModal()"
  >
    <app-change-password (closed)="closeOptionModal()" />
  </app-modal>
}
