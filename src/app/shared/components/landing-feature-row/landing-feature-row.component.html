<div class="landing-feature-row">
  <h2 class="section-title">{{ title }}</h2>

  <div class="feature-content" [class.reverse-layout]="direction === 'reverse'">
    <button class="arrow left-arrow" type="button" aria-label="Previous" (click)="previous.emit()">
      <span class="arrow-icon" aria-hidden="true">‹</span>
    </button>

    <div class="text-section">
      <h3>{{ cardTitle }}</h3>
      <p>{{ description }}</p>
    </div>

    <div class="image-section">
      @if (image) {
        <img [src]="image" [alt]="cardTitle || title" />
      }
    </div>

    <button class="arrow right-arrow" type="button" aria-label="Next" (click)="next.emit()">
      <span class="arrow-icon" aria-hidden="true">›</span>
    </button>
  </div>
</div>
