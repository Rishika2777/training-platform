<div class="app-form-container">
  @if (title && !isReviewMode) {
    <h2 class="app-form-title">{{ title }}</h2>
  }

  <form class="app-form" (submit)="$event.preventDefault(); submit()" novalidate>
    <div class="app-form-row">
      <app-input
        label="Campus Name"
        [required]="true"
        [invalid]="isInvalid('campusName')"
        type="text"
        [value]="value.campusName"
        (valueChange)="patch({ campusName: $event })"
        [disabled]="isFieldsDisabled"
      />

      <app-input
        label="Upload Photo"
        [required]="true"
        [invalid]="isInvalid('campusLogoFiles')"
        type="file"
        (filesSelected)="patch({ campusLogoFiles: $event })"
        [disabled]="isFieldsDisabled"
      />

      <app-input
        label="Campus Rank"
        [required]="true"
        [invalid]="isInvalid('rank')"
        type="number"
        [value]="value.rank"
        (valueChange)="patch({ rank: $event })"
        [disabled]="isFieldsDisabled"
      />
    </div>

    <div class="app-form-row">
      <app-input
        label="Admin Name"
        [required]="true"
        [invalid]="isInvalid('adminName')"
        type="text"
        [value]="value.adminName"
        (valueChange)="patch({ adminName: $event })"
        [disabled]="isFieldsDisabled"
      />

      <app-input
        label="Admin Email"
        [required]="true"
        [invalid]="isInvalid('adminEmail')"
        type="email"
        [value]="value.adminEmail"
        (valueChange)="patch({ adminEmail: $event })"
        [disabled]="isFieldsDisabled || adminEmailLocked"
      />

      <div class="app-form-field-wrapper">
        <app-input
          label="Admin Phone No."
          [required]="true"
          [invalid]="isInvalid('adminPhone')"
          type="tel"
          [value]="value.adminPhone"
          (valueChange)="patch({ adminPhone: $event })"
          [disabled]="isFieldsDisabled"
        />
        @if (submitAttempted && isAdminPhoneNotTenDigits()) {
          <div class="app-input-error">Mobile number must be exactly 10 digits.</div>
        }
      </div>
    </div>

    <div class="app-form-row">
      <app-input
        label="Admin Dept"
        [required]="true"
        [invalid]="isInvalid('adminDept')"
        type="text"
        [value]="value.adminDept"
        (valueChange)="patch({ adminDept: $event })"
        [disabled]="isFieldsDisabled"
      />

      <app-input
        label="Admin Designation"
        [required]="true"
        [invalid]="isInvalid('adminDesignation')"
        type="text"
        [value]="value.adminDesignation"
        (valueChange)="patch({ adminDesignation: $event })"
        [disabled]="isFieldsDisabled"
      />

      <app-input
        label="Campus Website URL"
        [required]="true"
        [invalid]="isInvalid('website')"
        type="url"
        placeholder="https://example.com"
        [value]="value.website"
        (valueChange)="patch({ website: $event })"
        [disabled]="isFieldsDisabled"
      />
    </div>

    <div class="app-form-row app-form-row-textarea">
      <div class="app-form-col-textarea">
        <app-textarea
          label="About Campus"
          [required]="true"
          [invalid]="isInvalid('about')"
          [rows]="4"
          [value]="value.about"
          (valueChange)="patch({ about: $event })"
          [disabled]="isFieldsDisabled"
          [maxlength]="2000"
          [showCharCount]="true"
        />
      </div>

      <div class="app-form-col-textarea">
        <app-textarea
          label="Campus Address"
          [required]="true"
          [invalid]="isInvalid('address')"
          [rows]="4"
          [value]="value.address"
          (valueChange)="patch({ address: $event })"
          [disabled]="isFieldsDisabled"
          [maxlength]="500"
          [showCharCount]="true"
        />
      </div>
    </div>

    <div class="app-form-actions">
      @if (isReviewMode && !isEditMode) {
        <div style="display: flex; gap: 12px; justify-content: center; align-items: center;">
          <app-button
            type="button"
            variant="outline"
            label="Reject"
            [disabled]="submitting || approveDisabled"
            (buttonClick)="reject()"
          />
          <app-button
            type="button"
            variant="secondary"
            label="Approve"
            [disabled]="submitting || approveDisabled"
            (buttonClick)="approve()"
          />
        </div>
      } @else if (isReviewMode && isEditMode) {
        <app-button
          type="button"
          variant="outline"
          label="Cancel"
          [disabled]="submitting"
          (buttonClick)="cancelled.emit()"
        />
        <app-button type="submit" variant="primary" label="Update" [disabled]="submitting" />
      } @else {
        <app-button
          type="button"
          variant="outline"
          label="Cancel"
          [disabled]="submitting"
          (buttonClick)="cancelled.emit()"
        />
        <app-button type="submit" variant="primary" label="Submit" [disabled]="submitting" />
      }
    </div>
  </form>
</div>
