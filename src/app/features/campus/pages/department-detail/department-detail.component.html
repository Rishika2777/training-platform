@if (department(); as dept) {

<div class="department-detail-card">

  <!-- DELETE ICON -->
  <button class="delete-btn" (click)="openDeleteConfirm(dept)">
    <i class="fa-solid fa-trash"></i>
  </button>

  
 <button class="edit-btn" (click)="editDepartment(dept)">
  <i class="fa-solid fa-pen"></i>
</button>




  <!-- CLOSE -->
  <button class="close-btn" (click)="close()">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <!-- IMAGE -->
  <div class="dept-avatar">
    <img [src]="dept.imageUrl" alt="department" />
  </div>

  <!-- NAME -->
  <div class="dept-name">{{ dept.name }}</div>

  <!-- ABOUT -->
  <div class="dept-about">{{ dept.about }}</div>

  <!-- CONTACT -->
  <div class="dept-contact">

    @if (dept.email) {
      <div class="contact-row">
        <i class="fa-solid fa-envelope"></i>
        <span>{{ dept.email }}</span>
      </div>
    }

    @if (dept.phone) {
      <div class="contact-row">
        <i class="fa-solid fa-phone"></i>
        <span>{{ dept.phone }}</span>
      </div>
    }

  </div>

</div>

  <!-- Delete Department Confirmation Modal -->
  <app-modal
    [visible]="showDeleteConfirmModal"
    title="Delete Department"
    size="sm"
    [stacked]="true"
    (closed)="closeDeleteConfirmModal()"
  >
    <div class="delete-modal-content">
      <p>Are you sure you want to delete this department? This action cannot be undone.</p>
      @if (departmentToDelete) {
        <div class="delete-item-info">
          <strong>{{ departmentToDelete.name }}</strong>
        </div>
      }
      <div class="delete-modal-actions">
        <app-button
          label="Cancel"
          variant="outline"
          (buttonClick)="closeDeleteConfirmModal()"
        ></app-button>
        <app-button
          label="Delete"
          variant="primary"
          (buttonClick)="confirmDeleteDepartment()"
        ></app-button>
      </div>
    </div>
  </app-modal>
}
