<form class="placed-students-form" (ngSubmit)="onFormSubmit($event)">
  <div class="form-grid">
    <div class="form-row">
      <app-dropdown
        label="Student Name"
        [items]="studentNameItems()"
        [value]="value.studentName"
        [disabled]="submitting || loadingStudentNames()"
        (valueChange)="patch({ studentName: $event })"
        [autocomplete]="true"
        [allowCustom]="true"
        placeholder="Select or type student name"
      />
    </div>

    <div class="form-row">
      <app-input
        label="Student Photo"
        type="text"
        [value]="studentPhotoName || 'Select photo file'"
        [disabled]="true"
        placeholder="Select photo file"
      />
      <button type="button" class="file-attach-btn" (click)="triggerStudentPhotoSelect()">
        <i class="fa-solid fa-paperclip"></i>
      </button>
      <input
        #studentPhotoFileInput
        type="file"
        accept="image/*"
        style="display: none"
        [disabled]="submitting"
        (change)="onStudentPhotoSelected($any($event.target).files)"
      />
    </div>

    <div class="form-row">
      <app-dropdown
        label="Course"
        [items]="courseItems()"
        [value]="value.course"
        [disabled]="submitting || loadingCourses()"
        (valueChange)="patch({ course: $event })"
        [autocomplete]="true"
      />
    </div>

    <div class="form-row">
      <app-dropdown
        label="Batch"
        [items]="batchItems()"
        [value]="value.batch"
        [disabled]="submitting || loadingBatches()"
        (valueChange)="patch({ batch: $event })"
        [autocomplete]="true"
      />
    </div>

    <div class="form-row">
      <app-input
        label="Placement Company"
        type="text"
        [value]="value.placementCompany"
        [disabled]="submitting"
        (valueChange)="patch({ placementCompany: $event })"
      />
    </div>

    <div class="form-row">
      <app-dropdown
        label="Designation"
        [items]="designationItems()"
        [value]="value.designation"
        [disabled]="submitting || loadingDesignations()"
        (valueChange)="patch({ designation: $event })"
        [autocomplete]="true"
      />
    </div>

    <div class="form-row">
      <app-dropdown
        label="Sector"
        [items]="sectorItems()"
        [value]="value.sector"
        [disabled]="submitting || loadingSectors()"
        (valueChange)="patch({ sector: $event })"
        [autocomplete]="true"
      />
    </div>
  </div>

  <div class="form-actions">
    <button 
      type="button"
      class="btn primary"
      [disabled]="submitting"
      (click)="onButtonClickDirect($event)"
    >
      Submit
    </button>
  </div>
</form>
