<form class="visit-campus-form" (ngSubmit)="onFormSubmit($event)">
  <!-- <h2 class="form-title">Visit Campus Form</h2> -->
  
  <!-- First Row: Three fields -->
  <div class="form-row-three">
    <app-input
      label="Company Name"
      type="text"
      [value]="value.companyName"
      [disabled]="submitting"
      (valueChange)="patch({ companyName: $event })"
    />
    <app-input
      label="Contact Person Name"
      type="text"
      [value]="value.contactPersonName"
      [disabled]="submitting"
      (valueChange)="patch({ contactPersonName: $event })"
    />
    <app-input
      label="Contact Person Phone No."
      type="tel"
      [value]="value.contactPersonPhoneNo"
      [disabled]="submitting"
      (valueChange)="patch({ contactPersonPhoneNo: $event })"
       (paste)="onPhonePaste($event)"
    />
  </div>

  <!-- Second Row: Contact Person Email and Recruitment Type -->
  <div class="form-row-two">
    <app-input
      label="Contact Person Email"
      type="email"
      [value]="value.contactPersonEmail"
      [disabled]="submitting"
      (valueChange)="patch({ contactPersonEmail: $event })"
    />
    <div class="recruitment-type-wrapper">
      <div class="form-label">Recruitment Type</div>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="value.recruitmentType.internship"
            [disabled]="submitting"
            (change)="patchRecruitmentType('internship', $any($event.target).checked)"
          />
          <span>Internship</span>
        </label>
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="value.recruitmentType.fullTime"
            [disabled]="submitting"
            (change)="patchRecruitmentType('fullTime', $any($event.target).checked)"
          />
          <span>Full-time</span>
        </label>
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="value.recruitmentType.both"
            [disabled]="submitting"
            (change)="patchRecruitmentType('both', $any($event.target).checked)"
          />
          <span>Both</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Third Row: No. of Positions, Package, Date and Time -->
  <div class="form-row-four">
    <app-input
      label="No. of Positions"
      type="text"
      [value]="value.numberOfPositions"
      [disabled]="submitting"
      (valueChange)="patch({ numberOfPositions: $event })"
    />
    <app-input
      label="Package"
      type="number"
      min="1"
      [value]="value.package"
      [disabled]="submitting"
      (valueChange)="patch({ package: $event })"
    />
 <app-input
  label="Date of Visit"
  type="date"
  [value]="value.dateOfVisit"
  [min]="todayDate"
  [disabled]="submitting"
  (valueChange)="patch({ dateOfVisit: $event })"
/>

    <div class="time-input-wrapper">
      <app-input
        label="Time of Visit"
        type="time"
        [value]="value.timeOfVisit"
        [disabled]="submitting"
        (valueChange)="onTimeInputChange($event)"
      />
      <select
        class="am-pm-selector"
        [value]="value.timeOfVisitAmPm"
        [disabled]="submitting"
        (change)="patch({ timeOfVisitAmPm: $any($event.target).value })"
      >
        <option value="AM">AM</option>
        <option value="PM">PM</option>
      </select>
    </div>
  </div>

  <!-- Fourth Row: Attachments and Additional Requirements -->
  <div class="form-row-two">
    <div class="form-row-attachment">
      <div class="form-label">Attachments</div>
      <div class="attachment-input-wrapper">
        <app-input
          label=""
          type="text"
          [value]="attachmentsList.length > 0 ? `${attachmentsList.length} file(s) selected` : 'Select files'"
          [disabled]="true"
          placeholder="Select files"
        />
        <button type="button" class="file-attach-btn" (click)="triggerAttachmentsSelect()" [disabled]="submitting">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <input
          #attachmentsFileInput
          type="file"
          style="display: none"
          [disabled]="submitting"
          [multiple]="true"
          (change)="onAttachmentsSelected($any($event.target).files)"
        />
      </div>
      @if (attachmentsList.length > 0) {
        <div class="attachment-files-list">
          @for (file of attachmentsList; track $index) {
            <div class="attachment-file-item">
              <span class="file-name" [title]="file.name">{{ file.name }}</span>
              <span class="file-size">({{ formatFileSize(file.size) }})</span>
              <button
                type="button"
                class="remove-file-btn"
                [disabled]="submitting"
                (click)="removeAttachment($index)"
                title="Remove file"
              >
                <i class="fa-solid fa-times"></i>
              </button>
            </div>
          }
        </div>
      }
    </div>
    <app-textarea
      label="Additional requirements"
      [value]="value.additionalRequirements"
      [disabled]="submitting"
      [rows]="4"
      (valueChange)="patch({ additionalRequirements: $event })"
      [maxlength]="500"
      [showCharCount]="true"
    />
  </div>

  <div class="form-actions">
    <button 
      type="button"
      class="btn primary"
      [disabled]="submitting"
      (click)="onButtonClickDirect($event)"
    >
      Submit
    </button>
  </div>
</form>
