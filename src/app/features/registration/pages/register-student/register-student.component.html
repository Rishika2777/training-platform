<app-registration-page-layout [showSearch]="false">
  <app-student-form
    [value]="formValue"
    [submitting]="submitting"
    [emailLocked]="emailLocked"
    [campuses]="campuses"
    (valueChange)="formValue = $event"
    (submitted)="submit($event)"
    (cancelled)="cancel()"
  />
</app-registration-page-layout>
