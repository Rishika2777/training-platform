<app-registration-page-layout
  [showSearch]="false"
  [searchValue]="searchValue"
  (searchValueChange)="searchValue = $event"
  (searched)="handleSearch($event)"
>
  <app-company-form
    title="Company Registration Form"
    mode="create"
    [value]="formValue"
    [submitting]="submitting"
    [adminEmailLocked]="adminEmailLocked"
    (valueChange)="formValue = $event"
    (submitted)="submit($event)"
    (cancelled)="cancel()"
  />
</app-registration-page-layout>
