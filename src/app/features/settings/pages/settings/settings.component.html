<section class="settings-page">
  <div class="settings-wrapper">
    <div class="settings-sidebar">
      <h2 class="settings-title">Settings</h2>
      
      <nav class="settings-list">
        <a class="settings-item" [routerLink]="['/settings', 'profile']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Profile</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'password']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Password</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'help-center']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Help Center</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'data-privacy']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Data Privacy</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'contact-support']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Contact Support</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'report-issues']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Report Issues</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
        
        <a class="settings-item" [routerLink]="['/settings', 'delete-account']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          <span class="item-text">Delete Account</span>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
      </nav>
    </div>
    
    <div class="settings-content">
      <router-outlet />
    </div>
  </div>
</section>
