<div class="bug-report-form">
  <form class="bug-report-form-container">
    <app-input
      label="Title"
      type="text"
      [value]="form.get('title')?.value || ''"
      [required]="true"
      [invalid]="titleInvalid"
      placeholder="What is the bug?"
      (valueChange)="form.patchValue({ title: $event })"
    />

    <app-textarea
      label="Description"
      [value]="form.get('description')?.value || ''"
      [required]="true"
      [invalid]="descriptionInvalid"
      [rows]="4"
      placeholder="Describe the bug in detail..."
      (valueChange)="form.patchValue({ description: $event })"
      [maxlength]="500"
      [showCharCount]="true"
    />


    <div class="form-actions">
      <app-button
        label="Cancel"
        type="button"
        variant="outline"
        [disabled]="submitting()"
        (buttonClick)="onCancel()"
      />
      <app-button
        label="Submit"
        type="button"
        variant="primary"
        [disabled]="submitting() || form.invalid"
        (buttonClick)="onSubmit($event)"
      />
    </div>
  </form>
</div>
