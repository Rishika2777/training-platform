<div class="bug-report-form">
  <form>
    <app-input
      label="Bug Title"
      type="text"
      [value]="form.get('title')?.value || ''"
      [required]="true"
      [invalid]="titleInvalid"
      placeholder="Brief description of the bug"
      (valueChange)="form.patchValue({ title: $event })"
    />

    <app-textarea
      label="Description"
      [value]="form.get('description')?.value || ''"
      [required]="true"
      [invalid]="descriptionInvalid"
      [rows]="4"
      placeholder="Describe the bug in detail..."
      (valueChange)="form.patchValue({ description: $event })"
      [maxlength]="500"
      [showCharCount]="true"
    />

    <app-textarea
      label="Steps to Reproduce"
      [value]="form.get('stepsToReproduce')?.value || ''"
      [required]="true"
      [invalid]="stepsToReproduceInvalid"
      [rows]="4"
      placeholder="1. Go to...&#10;2. Click on...&#10;3. See error..."
      (valueChange)="form.patchValue({ stepsToReproduce: $event })"
      [maxlength]="500"
      [showCharCount]="true"
    />

    <app-textarea
      label="Expected Behavior"
      [value]="form.get('expectedBehavior')?.value || ''"
      [required]="true"
      [invalid]="expectedBehaviorInvalid"
      [rows]="3"
      placeholder="What should have happened instead?"
      (valueChange)="form.patchValue({ expectedBehavior: $event })"
      [maxlength]="300"
      [showCharCount]="true"
    />

    <div class="form-actions">
      <app-button
        label="Cancel"
        type="button"
        variant="outline"
        [disabled]="submitting()"
        (buttonClick)="onCancel()"
      />
      <app-button
        label="Submit Bug Report"
        type="button"
        variant="primary"
        [disabled]="submitting() || form.invalid"
        (buttonClick)="onSubmit($event)"
      />
    </div>
  </form>
</div>
