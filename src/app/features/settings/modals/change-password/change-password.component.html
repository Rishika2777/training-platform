<div class="change-password-form">
  <form>
    <app-input
      label="Current Password"
      type="password"
      [value]="form.get('currentPassword')?.value || ''"
      [required]="true"
      [invalid]="currentPasswordInvalid"
      (valueChange)="form.patchValue({ currentPassword: $event })"
    />

    <app-input
      label="New Password"
      type="password"
      [value]="form.get('newPassword')?.value || ''"
      [required]="true"
      [invalid]="newPasswordInvalid"
      (valueChange)="onNewPasswordChange($event)"
    />

    <app-input
      label="Confirm New Password"
      type="password"
      [value]="form.get('confirmPassword')?.value || ''"
      [required]="true"
      [invalid]="confirmPasswordInvalid || passwordMismatch"
      (valueChange)="onConfirmPasswordChange($event)"
    />

    @if (passwordMismatch) {
      <div class="field-error">Passwords do not match</div>
    }

    <div class="form-actions">
      <app-button
        label="Save"
        type="button"
        variant="primary"
        [disabled]="submitting() || form.invalid"
        (buttonClick)="onSubmit($event)"
      />
    </div>
  </form>
</div>
