<div class="feedback-form">
  <form>
    <app-input
      label="Subject"
      type="text"
      [value]="form.get('subject')?.value || ''"
      [required]="true"
      [invalid]="subjectInvalid"
      placeholder="Enter feedback subject"
      (valueChange)="form.patchValue({ subject: $event })"
    />

    <app-textarea
      label="Message"
      [value]="form.get('message')?.value || ''"
      [required]="true"
      [invalid]="messageInvalid"
      [rows]="6"
      placeholder="Please share your feedback..."
      (valueChange)="form.patchValue({ message: $event })"
      [maxlength]="1000"
      [showCharCount]="true"
    />

    <div class="form-actions">
      <app-button
        label="Cancel"
        type="button"
        variant="outline"
        [disabled]="submitting()"
        (buttonClick)="onCancel()"
      />
      <app-button
        label="Submit Feedback"
        type="button"
        variant="primary"
        [disabled]="submitting() || form.invalid"
        (buttonClick)="onSubmit($event)"
      />
    </div>
  </form>
</div>
