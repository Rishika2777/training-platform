<div class="feedback-form">
  <form class="feedback-form-container">
    <app-input
      label="Title"
      type="text"
      [value]="form.get('title')?.value || ''"
      [required]="true"
      [invalid]="titleInvalid"
      placeholder="What do you want to share?"
      (valueChange)="form.patchValue({ title: $event })"
    />

    <app-textarea
      label="Description"
      [value]="form.get('description')?.value || ''"
      [required]="true"
      [invalid]="descriptionInvalid"
      [rows]="6"
      placeholder="Please describe your feedback in detail..."
      (valueChange)="form.patchValue({ description: $event })"
      [maxlength]="1000"
      [showCharCount]="true"
      [showCharCount]="true"
    />

    <div class="form-actions">
      <app-button
        label="Cancel"
        type="button"
        variant="outline"
        [disabled]="submitting()"
        (buttonClick)="onCancel()"
      />
      <app-button
        label="Submit Feedback"
        type="button"
        variant="primary"
        [disabled]="submitting() || form.invalid"
        (buttonClick)="onSubmit($event)"
      />
    </div>
  </form>
</div>
