<form class="vision-performance-form" (ngSubmit)="onFormSubmit($event)">
  <div class="form-header">
    <h2 class="form-title">Our Vision & Achievements</h2>
  </div>

  <div class="form-content">
    <!-- Vision Field -->
    <div class="form-field">
      <label class="field-label" for="company-vision">Company's Vision</label>
      <textarea
        id="company-vision"
        class="vision-textarea"
        [value]="value.vision"
        [disabled]="submitting || loading"
        placeholder="Enter your company's vision..."
        (input)="updateVision($any($event.target).value)"
      ></textarea>
    </div>

    <!-- Metrics Section -->
    <div class="metrics-section">
      @for (metric of value.metrics; track $index; let i = $index) {
        <div class="metrics-row">
          <app-dropdown
            label="Metric Name"
            [items]="metricNameItems"
            [value]="metric.name"
            [disabled]="submitting || loading"
            placeholder="Select metric"
            (valueChange)="updateMetric(i, 'name', $event)"
            [autocomplete]="true"
          ></app-dropdown>

          <app-dropdown
            label="Value"
            [items]="valueItems"
            [value]="metric.value"
            [disabled]="submitting || loading"
            placeholder="Select value"
            (valueChange)="updateMetric(i, 'value', $event)"
            [autocomplete]="true"
          ></app-dropdown>

          <app-dropdown
            label="Year"
            [items]="yearItems"
            [value]="metric.year"
            [disabled]="submitting || loading"
            placeholder="Select year"
            (valueChange)="updateMetric(i, 'year', $event)"
            [autocomplete]="true"
          ></app-dropdown>
        </div>
      }
    </div>

    <!-- Display response message -->
    @if (responseMessage) {
      <div class="response-message">
        {{ responseMessage }}
      </div>
    }
  </div>

  <div class="form-actions">
    <app-button
      type="button"
      label="Submit"
      variant="primary"
      [disabled]="submitting || loading"
      (buttonClick)="onButtonClick()"
    ></app-button>
  </div>
</form>
