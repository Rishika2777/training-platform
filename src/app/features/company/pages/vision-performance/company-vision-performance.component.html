<form class="vision-performance-form" (ngSubmit)="$event.preventDefault(); submit()">
  <div class="form-header">
    <h2 class="form-title">Our Vision & Achievements</h2>
  </div>

  <div class="form-content">
    <div class="form-field">
      <label class="field-label" for="company-vision">Company's Vision</label>
      <textarea
        id="company-vision"
        class="vision-textarea"
        [value]="value.vision"
        [disabled]="submitting"
        placeholder="Enter your company's vision..."
        (input)="updateVision($any($event.target).value)"
      ></textarea>
    </div>

    <div class="metrics-section">
      @for (metric of value.metrics; track $index) {
        <div class="metrics-row">
          <app-dropdown
            label="Metric Name"
            [items]="metricNameItems"
            [value]="metric.name"
            [disabled]="submitting"
            placeholder="Select metric"
            (valueChange)="updateMetric($index, 'name', $event)"
          />
          <app-dropdown
            label="Value"
            [items]="valueItems"
            [value]="metric.value"
            [disabled]="submitting"
            placeholder="Select value"
            (valueChange)="updateMetric($index, 'value', $event)"
          />
          <app-dropdown
            label="Year"
            [items]="yearItems"
            [value]="metric.year"
            [disabled]="submitting"
            placeholder="Select year"
            (valueChange)="updateMetric($index, 'year', $event)"
          />
        </div>
      }
    </div>
  </div>

  <div class="form-actions">
    <app-button type="submit" label="Submit" variant="primary" [disabled]="submitting" />
  </div>
</form>
