<form class="vision-performance-form" (ngSubmit)="onFormSubmit($event)">
  <div class="form-content">
    <!-- Vision Field -->
    <div class="form-field">
      <label class="field-label" for="company-vision">
        Company's Vision
        <span class="asterisk" aria-hidden="true">*</span>
      </label>
  <textarea
  id="company-vision"
  class="vision-textarea"
  [class.invalid]="visionInvalid"
  [value]="value.vision"
  [disabled]="loading"
  placeholder="Enter your company's vision..."
  (input)="updateVision($any($event.target).value)"
  required
  maxlength="500"
></textarea>

@if (visionInvalid) {
  <div class="error-text">
    Company vision must be at least 20 characters.
  </div>
}




    </div>

    <!-- Metrics Section -->
    <div class="metrics-section">
      @for (metric of value.metrics; track $index) {
        <div class="metrics-row">
          <app-dropdown
            label="Metric Name"
            [items]="metricNameItems"
            [value]="metric.name"
            [disabled]="loading"
            [required]="true"
            [invalid]="metricInvalidations[$index] && !metric.name"
            placeholder="Select metric"
            (valueChange)="updateMetric($index, 'name', $event)"
            [autocomplete]="true"
          ></app-dropdown>

          <app-dropdown
            label="Value"
            [items]="valueItems"
            [value]="metric.value"
            [disabled]="loading"
            [required]="true"
            [invalid]="metricInvalidations[$index] && !metric.value"
            placeholder="Select value"
            (valueChange)="updateMetric($index, 'value', $event)"
            [autocomplete]="true"
          ></app-dropdown>

          <app-dropdown
            label="Year"
            [items]="yearItems"
            [value]="metric.year"
            [disabled]="loading"
            [required]="true"
            [invalid]="metricInvalidations[$index] && !metric.year"
            placeholder="Select year"
            (valueChange)="updateMetric($index, 'year', $event)"
            [autocomplete]="true"
          ></app-dropdown>
        </div>
      }
    </div>
  </div>

  <div class="form-actions">
    <app-button
      type="button"
      label="Submit"
      variant="primary"
      [disabled]="loading"
      (buttonClick)="onButtonClick()"
    ></app-button>
  </div>
</form>
