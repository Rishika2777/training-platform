<form class="preferred-campus-form" (ngSubmit)="onFormSubmit($event)">
  <div class="form-row">
    <div class="file-input-wrapper">
      <div class="field-label">
        Upload photo
      </div>
      <div class="file-input-container">
        <app-input
          type="text"
          [value]="photoName || 'Select photo file'"
          [disabled]="true"
          [invalid]="submitAttempted && !value.photo"
          placeholder="Select photo file"
        />
        <button
          type="button"
          class="file-attach-btn"
          (click)="triggerPhotoSelect()"
          [disabled]="submitting"
          [attr.aria-label]="'Select photo file'"
        >
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <input
          #photoFileInput
          type="file"
          accept="image/*"
          style="display: none"
          [disabled]="submitting"
          (change)="onPhotoSelected($any($event.target).files)"
        />
      </div>
      @if (submitAttempted && !value.photo) {
        <span class="error-message">Photo is required</span>
      }
    </div>
  </div>

  <div class="form-row">
    <app-dropdown
      label="Campus Name"
      [items]="campusDropdownItems"
      [value]="value.campusId || null"
      [disabled]="submitting || loadingCampuses"
      [invalid]="submitAttempted && !value.campusId"
      [required]="true"
      placeholder="Select campus"
      (valueChange)="onCampusSelected($event)"
    />
    @if (loadingCampuses) {
      <span class="loading-message">Loading campuses...</span>
    }
    @if (submitAttempted && !value.campusId) {
      <span class="error-message">Campus name is required</span>
    }
  </div>

  <div class="form-actions">
    <app-button
      type="submit"
      label="Submit"
      variant="primary"
      [disabled]="submitting"
      (buttonClick)="onButtonClick($event)"
    />
  </div>
</form>
