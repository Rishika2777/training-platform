<div class="login-page">
  <div class="header-btn">
    <app-button
      class="register-btn"
      type="button"
      variant="outline"
      label="Register"
      (buttonClick)="goToRegisterOptions()"
    />
  </div>

  <div class="container">
    <!-- Left: Robot (with animation) -->
    <div class="robot-section" aria-hidden="true">
      <div class="robot-wrap">
        <svg class="robot-mascot" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
          <!-- Antennae -->
          <line x1="85" y1="40" x2="80" y2="10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="115" y1="40" x2="120" y2="10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="80" cy="10" r="4" fill="#5885E6"/>
          <circle cx="120" cy="10" r="4" fill="#5885E6"/>
          <!-- Head -->
          <rect x="50" y="45" width="100" height="70" rx="12" fill="#fff"/>
          <!-- Eyes (glowing blue) -->
          <circle class="robot-eye" cx="85" cy="75" r="14" fill="#5885E6" filter="url(#glow)"/>
          <circle class="robot-eye" cx="115" cy="75" r="14" fill="#5885E6" filter="url(#glow)"/>
          <circle cx="85" cy="75" r="6" fill="#A2C2F7"/>
          <circle cx="115" cy="75" r="6" fill="#A2C2F7"/>
          <!-- Smile -->
          <path d="M 75 95 Q 100 108 125 95" stroke="#5885E6" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Neck glow -->
          <rect x="88" y="112" width="24" height="8" rx="2" fill="#5885E6" opacity="0.8"/>
          <!-- Body -->
          <rect x="40" y="120" width="120" height="90" rx="8" fill="#fff"/>
          <rect x="55" y="135" width="35" height="25" rx="4" fill="#A2C2F7" opacity="0.5"/>
          <rect x="110" y="135" width="35" height="25" rx="4" fill="#A2C2F7" opacity="0.5"/>
          <!-- Joint glow -->
          <circle cx="65" cy="215" r="8" fill="#5885E6" opacity="0.7"/>
          <circle cx="135" cy="215" r="8" fill="#5885E6" opacity="0.7"/>
          <!-- Feet -->
          <rect x="55" y="218" width="30" height="18" rx="4" fill="#fff"/>
          <rect x="115" y="218" width="30" height="18" rx="4" fill="#fff"/>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </svg>
      </div>
    </div>

    <!-- Right: Form -->
    <div class="form-section">
      <h1 class="auth-title">Login</h1>

      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-input-wrap">
          <input
            class="auth-input"
            type="text"
            placeholder="username"
            [value]="form.controls.email.value"
            (input)="form.controls.email.setValue($any($event.target).value)"
          />
          <span class="auth-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
        </div>

        <div class="auth-input-wrap">
          <input
            class="auth-input"
            type="password"
            placeholder="password"
            [value]="form.controls.password.value"
            (input)="form.controls.password.setValue($any($event.target).value)"
          />
          <span class="auth-input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
        </div>

        <div class="forgot-row">
          <a class="forgot-link" href="javascript:void(0)" (click)="forgotPassword(); $event.preventDefault()">Forgot password?</a>
        </div>

        <button
          class="auth-btn"
          type="submit"
          [disabled]="form.invalid || submitting"
        >
          Login
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <button
          class="google-btn"
          type="button"
          [disabled]="submitting || googleSigningIn"
          (click)="signInWithGoogle()"
        >
          <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="google-btn-text">Continue with Google</span>
        </button>

        <p class="auth-footer-text">
          Don't have an account? <span class="auth-link" role="link" tabindex="0" (click)="goToRegisterOptions()" (keyup.enter)="goToRegisterOptions()">Sign Up</span>
        </p>
      </form>
    </div>
  </div>

  <footer class="auth-page-footer">© 2025 Synkup Solutions. All rights reserved.</footer>
</div>

<!-- OTP Verification Modal -->
<app-modal
  [visible]="showOtpModal"
  title="Verify OTP"
  size="md"
  (closed)="handleOtpCancel()"
>
  <app-verify-otp
    [submitting]="verifyingOtp"
    [resending]="resendingOtp"
    [email]="userEmail"
    (submitted)="handleOtpSubmit($event)"
    (cancelled)="handleOtpCancel()"
    (resendOtp)="handleResendOtp()"
  />
</app-modal>

<!-- Forgot Password Modal -->
<app-modal
  [visible]="showForgotPasswordModal"
  title="Forgot Password"
  size="md"
  (closed)="handleForgotPasswordCancel()"
>
  <form class="forgot-password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="handleForgotPasswordSubmit()">
    <p class="forgot-modal-text">Enter your email address and we'll send you a password reset token.</p>
    <app-input
      label=""
      type="email"
      placeholder="Email"
      [value]="forgotPasswordForm.controls.email.value"
      [disabled]="submittingForgotPassword"
      (valueChange)="forgotPasswordForm.controls.email.setValue($event)"
    />
    <div class="forgot-modal-actions">
      <app-button
        type="button"
        variant="outline"
        label="Cancel"
        [disabled]="submittingForgotPassword"
        (buttonClick)="handleForgotPasswordCancel()"
      />
      <app-button
        type="submit"
        variant="outline"
        label="Send Reset Link"
        [disabled]="submittingForgotPassword || forgotPasswordForm.invalid"
      />
    </div>
  </form>
</app-modal>

<!-- User Type Selection Modal for Google Login -->
<app-modal
  [visible]="showUserTypeModal"
  title="Select Your Account Type"
  size="md"
  (closed)="handleUserTypeModalCancel()"
>
  <div class="user-type-modal-content">
    <p class="user-type-modal-text">Please select your account type to continue with Google sign-in.</p>
    <app-button
      type="button"
      variant="outline"
      label="Continue as Student"
      [disabled]="submitting"
      (buttonClick)="handleUserTypeSelection('STUDENT')"
    />
    <app-button
      type="button"
      variant="outline"
      label="Continue as Campus"
      [disabled]="submitting"
      (buttonClick)="handleUserTypeSelection('CAMPUS')"
    />
    <app-button
      type="button"
      variant="outline"
      label="Continue as Company"
      [disabled]="submitting"
      (buttonClick)="handleUserTypeSelection('COMPANY')"
    />
    <div class="user-type-modal-cancel">
      <app-button
        type="button"
        variant="outline"
        label="Cancel"
        [disabled]="submitting"
        (buttonClick)="handleUserTypeModalCancel()"
      />
    </div>
  </div>
</app-modal>
