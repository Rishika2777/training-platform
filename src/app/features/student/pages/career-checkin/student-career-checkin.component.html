<form class="career-checkin-form" (ngSubmit)="$event.preventDefault(); submit()">
  <div class="form-row">
    <app-input
      label="Company Name"
      type="text"
      [value]="value.companyName"
      [disabled]="submitting"
      [required]="true"
      (valueChange)="patch({ companyName: $event })"
    />
  </div>

  <div class="form-row">
    <app-dropdown
      label="Job Title"
      [items]="jobTitleItems"
      [value]="value.jobTitle"
      [disabled]="submitting"
      [required]="true"
      placeholder="Select job title"
      (valueChange)="patch({ jobTitle: $event })"
      [autocomplete]="true"
    />
  </div>

  <div class="form-row">
    <app-input
      label="Start Date"
      type="date"
      [value]="value.startDate"
      [disabled]="submitting"
      [required]="true"
      (valueChange)="patch({ startDate: $event })"
    />
  </div>

  <div class="form-row">
    <app-input
      label="End Date"
      type="date"
      [value]="value.endDate"
      [disabled]="submitting || value.currentlyWorking"
      [required]="!value.currentlyWorking"
      (valueChange)="patch({ endDate: $event })"
    />
  </div>

  <div class="checkbox-section">
    <div class="form-row checkbox-row">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [checked]="value.currentlyWorking"
          [disabled]="submitting"
          (change)="toggleCurrentlyWorking()"
        />
        <span class="checkbox-text">I am currently working here</span>
      </label>
    </div>

    <div class="form-row checkbox-row">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [checked]="value.recnHelped"
          [disabled]="submitting"
          (change)="toggleRecnHelped()"
        />
        <span class="checkbox-text">Synkup helped me to get this job</span>
      </label>
    </div>
  </div>

  <div class="form-actions">
    <app-button type="submit" label="Update" variant="primary" [disabled]="submitting" />
  </div>
</form>
