name: Angular CI

on:
  push:
    branches:
      - main
      - development
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Run tests (headless)
      #   run: npm test

      - name: Build Angular app
        run: npm run build
      
      - name: Copy Artifacts to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          password: ${{ secrets.BACKEND_SERVER_PASSWORD }}
          source: "dist"
          target: "/home/${{ secrets.BACKEND_SERVER_USERNAME }}/deployments/Synkup_FE"
  
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Start Application
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          password: ${{ secrets.BACKEND_SERVER_PASSWORD }}
          script: bash -lic "pm2 reload /home/${{ secrets.BACKEND_SERVER_USERNAME }}/ecosystem.config.js --only Synkup_FE"
