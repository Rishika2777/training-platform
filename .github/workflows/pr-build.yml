name: Angular CI

on:
  pull_request:
    branches:
      - main
      - development
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Run tests (headless)
      #   run: npm test

      - name: Build Angular app
        run: npm run build
